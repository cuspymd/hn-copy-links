<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- The page is read on a phone as often as on a desktop: Firefox for
       Android shows it inside the add-on's own screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle"></h1>

    <!-- Each checkbox names its key in the settings map; options.js binds
         every one it finds, so a new setting is markup and two messages. -->
    <label class="setting" for="setting-shareButton">
      <input type="checkbox" id="setting-shareButton" data-setting="shareButton">
      <span class="text">
        <span class="label" data-i18n="shareButtonSettingLabel"></span>
        <span class="hint" data-i18n="shareButtonSettingHint"></span>
      </span>
    </label>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <!-- Loaded in the same order the manifest injects them, and for the same
       reason: they find each other through `window`. -->
  <script src="../shared/logger.js"></script>
  <script src="../shared/browser-api.js"></script>
  <script src="../constants/storage-keys.js"></script>
  <script src="../shared/settings-core.js"></script>
  <script src="options.js"></script>
</body>
</html>
